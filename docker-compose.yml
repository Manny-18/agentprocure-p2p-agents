# One command starts the agents' API and n8n with both workflows already imported:
#   docker compose up --build
# Agents API + Swagger UI: http://localhost:8000/docs     n8n: http://localhost:5678
services:
  api:
    build: .
    image: agentprocure-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env          # optional: LLM_PROVIDER, GOOGLE_API_KEY, LLM_MODEL ... (offline mode without it)
        required: false
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.29.1   # pinned; any recent 2.x works
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/docker:/workflows:ro
    # Import (or update) both AgentProcure workflows, then start n8n
    entrypoint: ["/bin/sh", "-c"]
    command: ["n8n import:workflow --separate --input=/workflows && exec n8n start"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
